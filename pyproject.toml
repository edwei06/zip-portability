[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zip-portability"
version = "0.1.0"
description = "Inspect ZIP filename portability without extracting file contents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "edwei06"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
zip-portability = "zip_portability.cli:main"

[tool.setuptools.packages.find]
include = ["zip_portability*"]
